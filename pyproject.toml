[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piisafe"
dynamic = ["version"]
description = "Privacy guard for agentic AI workflows: consistent, policy-driven pseudonymisation of PII in logs, prompts and tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mann Patel" }]
keywords = ["pii", "privacy", "anonymisation", "pseudonymisation", "llm", "agents", "gdpr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "jellyfish>=1.0",
    "phonenumbers>=8.13",
    "cryptography>=41",
    "rich>=13",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
postgres = ["psycopg[binary]>=3.1"]
aws = ["boto3>=1.28"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
mcp = ["mcp>=1.2"]
agents = ["piisafe[langchain,langgraph,mcp]"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "httpx>=0.27", "pre-commit>=3.7"]

[project.scripts]
piisafe = "piisafe.cli:main"

[project.urls]
Homepage = "https://github.com/MannPatel250205/pii_safe"
Documentation = "https://github.com/MannPatel250205/pii_safe#readme"
Issues = "https://github.com/MannPatel250205/pii_safe/issues"

[tool.setuptools.dynamic]
version = { attr = "piisafe._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piisafe = ["policies/*.yaml", "py.typed", "server/static/*", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, in-process tests of the core library (tests/unit)",
    "integration: CLI, server, storage backends and agent frameworks (tests/integration)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
# Optional extras (spacy, boto3, mcp, psycopg) ship without stubs; without this
# every optional backend would need a per-module override.
ignore_missing_imports = true
# NOTE: strict mode needs the full dev install — `pip install -e ".[dev,server,agents]"`,
# the same set CI uses. With the server/agent extras missing, FastAPI and LangChain
# decorators degrade to Any and strict reports them as untyped.
files = ["src"]
